services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: peoplevault
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Copy .env.example to .env and set POSTGRES_APP_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d peoplevault"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgvector_data:
